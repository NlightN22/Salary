services:
  salary-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salary-web
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8000}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://127.0.0.1:8000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/salary_web/service_data/salary.db}
      SALARY_SESSION_SECRET: ${SALARY_SESSION_SECRET:-change-me-before-production}
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ./salary_web/service_data:/app/salary_web/service_data
      - ./Report:/app/Report
      - ./data:/app/Data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
